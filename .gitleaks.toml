# The secret scan of the landing gate (scripts/gate.sh): gitleaks (the version pinned in
# scripts/install_gitleaks.sh) with its 222 default rules, this project's own rules, and the reviewed
# exceptions below. The gate runs gitleaks with --ignore-gitleaks-allow and honours no .gitleaksignore, so an
# inline `gitleaks:allow` comment never lets a line through: every exception is an [[allowlists]] entry in
# this file, with its reason, approved by the landing's reviewer like any other change.
# The gate takes everything but the [[allowlists]] entries from the base, so a change to the rules applies
# from the next landing; the [[allowlists]] entries come from the landing itself. In them it accepts only
# these keys, one per line, with a string or an array of strings: description, targetRules, condition,
# paths, regexTarget, regexes, stopwords, commits.

title = "primordial-engine landing gate"

[extend]
useDefault = true

# The project's own secret formats.

[[rules]]
id = "pe-member-key-file"
description = "A pe-app member signing-key file: `pe-app session-new` writes member-<id>.key, the member's Ed25519 seed in hex (crates/pe-app/src/main.rs:108); it never belongs in the repository"
path = '''(^|/)member-[0-9]+\.key$'''

[[rules]]
id = "key-file-by-name"
description = "A file named like a private key or a key store (none is tracked today)"
path = '''(?i)(^|/)(id_(rsa|dsa|ecdsa|ed25519)(_sk)?|[^/]+\.(key|pem|p12|pfx|ppk|jks|keystore|kdbx))$'''

[[rules]]
id = "tailscale-key"
description = "A Tailscale auth, API or OAuth client key (the user's machines meet over Tailscale; no default rule covers it)"
regex = '''\btskey-[a-z]+-[0-9A-Za-z_-]{20,}'''
keywords = ["tskey-"]

# Reviewed exceptions, each matched on its exact line, so a changed line is scanned again.

[[allowlists]]
description = "pe-app session files (in main's history; M0 archived pe-app, and the tree holds none): members[].key is each member's Ed25519 VERIFYING key, public by design (archive/crates/pe-app/src/main.rs:110 writes hex(verifying_key); config.rs:86 reads it as one), and nonce is the session's shared nonce. The values below are every one that a key or nonce line of a session.json in main's history holds (380, read at 041af2d8 from git log -p main -- '*session.json'), so a new value, a secret seed in that place included, is scanned like any other line"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)session\.json$''']
regexTarget = "line"
regexes = [
  '''^\+?\s*"(key|nonce)"\s*:\s*"00aa2c6e5a61e73c89db80f3454ef2ff005b8f11976887769738409e959ca973",?\s*$''',
  '''^\+?\s*"(key|nonce)"\s*:\s*"0121ba59000c60aa4ea0c5710df48d56d51d6e8184f172dfe5315768d0ab8d0e",?\s*$''',
