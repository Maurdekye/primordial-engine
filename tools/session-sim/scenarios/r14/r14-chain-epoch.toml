description = """
P2-4 x P2-5: a provenance chain across a view change. Worlds A (60 Hz, members 1, 2 and 5), B \
(50 Hz, 1 and 3) and C (60 Hz, 1 and 4); A routes to B, B to A and C, C to B. Member 5 falls \
silent at 1 s and A removes it (epoch 1). Member 1 carries A's object 40 into B at frame 300, \
after the removal, so A's commit certificate is signed by epoch 1 and the hop relayed into B \
carries an epoch certificate; then on from B into C, where the arrival checks the chain back to \
A across the change."""
end_ms = 12000

[peer.1]
skew_us = 1200
[peer.2]
skew_us = -900
[peer.3]
skew_us = 400
[peer.4]
skew_us = -300
[peer.5]
skew_us = 200

[world.1]
members = [1, 2, 5]
scene = { pile = { side = 6, layers = 3 } }
epoch_ms = 100
seed = 0xA
routes = [2]

[world.1.plan]
1 = [
    { at = 240, every = 5, count = 12, touch = { obj = 40, impulse = [0.0, 0.3, 0.0], grab = true } },
    { at = 300, carry = { transfer = 1, obj = 40, dest = 2 } },
]
2 = [
    { at = 140, touch = { obj = 33, impulse = [2.0, 4.0, 0.0] } },
    { at = 330, touch = { obj = 12, impulse = [0.0, 5.0, 0.0] } },
]

# A:40 arrives in B as local 75 (B has 75 bodies): that object does not exist when the run
# starts, so its carry is marked missing_ok.
[world.2]
members = [1, 3]
scene = { pile = { side = 5, layers = 3 } }
epoch_ms = 150
hz = 50
seed = 0xB
routes = [1, 3]

[world.2.plan]
1 = [{ at = 400, carry = { transfer = 2, obj = 75, dest = 3 }, missing_ok = true }]
3 = [
    { at = 120, touch = { obj = 30, impulse = [0.0, 6.0, 0.0] } },
    { at = 260, touch = { obj = 8, impulse = [3.0, 3.0, 0.0] } },
]

[world.3]
members = [1, 4]
scene = { pile = { side = 4, layers = 3 } }
epoch_ms = 130
seed = 0xC
routes = [2]

[world.3.plan]
4 = [
    { at = 150, touch = { obj = 20, impulse = [0.0, 6.0, 0.0] } },
    { at = 600, touch = { obj = 5, impulse = [2.0, 5.0, 0.0] } },
]

[net]
seed = 23
link = { delay_ms = 50, jitter_ms = 15, loss_pct = 1 }

[[fault]]
involves = 5
after_ms = 1000
drop = true

[[report]]
kind = "r14_chain_epoch"
[[report]]
kind = "stats"
world = 1
[[report]]
kind = "stats"
world = 2
[[report]]
kind = "stats"
world = 3
[[report]]
