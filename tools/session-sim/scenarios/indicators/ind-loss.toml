description = """
Admin indicators (design 10.8): 10% loss on every link. Holes delay some references by a repair round \
trip, but no honest member is ever shown not referencing or flagged late."""
include = ["../common/review.toml"]
end_ms = 8000

[world.1.plan]
1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 400, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]

[net]
seed = 7
link = { delay_ms = 30, jitter_ms = 10, loss_pct = 10 }

[[report]]
kind = "indicators"
at = 1
label = "ind-loss"
honest = [2, 3]
