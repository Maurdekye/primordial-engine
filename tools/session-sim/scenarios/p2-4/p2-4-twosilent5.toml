description = """
P2-4, D80: two of five go silent at once (t = 3 s), under both quorum rules. A strict majority \
removes them; the Byzantine quorum (4 of 5) cannot, and the three left pause, safely."""
include = ["../common/review.toml"]
end_ms = 15000

[world.1]
members = [1, 2, 3, 4, 5]

[world.1.plan]
1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 400, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]

[[fault]]
involves = [4, 5]
after_ms = 3000
drop = true

[[part]]
world.1.quorum = "majority"
report = [
    { kind = "membership", honest = [1, 2, 3], label = "twosilent5-majority" },
    { kind = "view_changes", honest = [1, 2, 3], label = "twosilent5-majority" },
    { kind = "verdict", honest = [1, 2, 3], label = "twosilent5-majority (members 4 and 5 of 5 silent from t=3 s)" },
]

[[part]]
world.1.quorum = "bft"
report = [
    { kind = "membership", honest = [1, 2, 3], label = "twosilent5-bft" },
    { kind = "view_changes", honest = [1, 2, 3], label = "twosilent5-bft" },
    { kind = "verdict", honest = [1, 2, 3], label = "twosilent5-bft (members 4 and 5 of 5 silent from t=3 s)" },
]
