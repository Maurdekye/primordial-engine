description = """
Fault kinds (P2-9): as fault-capped-collapse, at 16 kbit/s on every link (with implicit ids, the run without the controller keeps confirming from 14 kbit/s up, and this one does not keep up at 12 or 13), with R18's per-tick batching and congestion controller on every member: hand entries and acks thin out as the uplink queue grows. Confirmation keeps close to the present, and every replica equals the offline replay."""
include = ["fault-capped-collapse.toml"]

[net]
batching = true
cap = { kbps = 16 }

[world.1.member.1]
adapt = true
[world.1.member.2]
adapt = true
[world.1.member.3]
adapt = true

[[report]]
kind = "stats"

[[report]]
kind = "traffic"

[[report]]
kind = "expect"
at = 1
conf_min = 550
label = "fault-capped-r18 (keeps confirming)"

[[report]]
kind = "check_world"
frames = 500
label = "fault-capped-r18"
