description = """
Fault kinds (P2-9): every link capped at 8 kbit/s, below what the pile's acks need at 60 Hz, with no congestion controller (R18 off). P2-3 had scaled the spike's 16 kbit/s to 46 for pe-session's larger messages; 7.6's ack reductions brought the need down to below 28 kbit/s, and implicit ids on the wire (the R18 below-20 item, option 1) below 14, and option 2's signed-once runs further (at 12 it still pauses, but confirms to frame 304, past this check's 250; at 10, 260): 8 keeps the run collapsing. The queues overflow, confirmation stalls and the members pause at the speculation limit. Safety holds: the confirmed prefix is equal on every replica and to the offline replay. fault-capped-r18 has the controller on, at 16 kbit/s (at 12 and 13 it does not keep up either)."""
include = ["../common/pile.toml", "../common/scripted.toml"]
end_ms = 10000

[net]
seed = 35
link = { delay_ms = 30, jitter_ms = 10 }
cap = { kbps = 8 }

[[report]]
kind = "stats"

[[report]]
kind = "traffic"

# Confirmation collapses (R18's finding): no replica gets past frame 250.
[[report]]
kind = "expect"
at = 1
conf_max = 250
label = "fault-capped-collapse (stall)"

[[report]]
kind = "check_world"
frames = 95
label = "fault-capped-collapse (confirmed prefix)"
