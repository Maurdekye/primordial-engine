description = """
Fault kinds (P2-9): member 3 crashes at 2 s (it receives, ticks and sends nothing) and resumes \
at 2.6 s with its state from before the crash, inside the silence threshold. Everything sent to \
it meanwhile is lost; it must catch up by gap repair."""
include = ["../common/pile.toml", "../common/scripted.toml"]
end_ms = 10000

[net]
seed = 37
link = { delay_ms = 30, jitter_ms = 10 }

[[crash]]
member = 3
at_ms = 2000
recover_ms = 2600

[[report]]
kind = "membership"
honest = [1, 2, 3]
label = "fault-crash-recover"

[[report]]
kind = "stats"

[[report]]
kind = "check_world"
frames = 550
label = "fault-crash-recover"
