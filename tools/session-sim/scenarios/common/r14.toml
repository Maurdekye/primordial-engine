# R14 set-up (session-sim main.rs `r14`): world 1 (A) is a 60 Hz pile, world 2 (B) a 50 Hz pile.
# Member 1 is in both and carries object 40 from A to B; member 2 is only in A, member 3 only
# in B. Member 1 grabs object 40 from frame 100 and departs it at frame 160. A and B trade with
# each other only (genesis route lists, D46). Variants override the plans, faults and reports.

end_ms = 9000

[peer.1]
skew_us = 1200
[peer.2]
skew_us = -900
[peer.3]
skew_us = 400
[peer.4]
skew_us = 300

[world.1]
members = [1, 2]
scene = { pile = { side = 6, layers = 3 } }
epoch_ms = 100
seed = 0xA
routes = [2]

[world.1.plan]
1 = [
    { at = 100, every = 5, count = 12, touch = { obj = 40, impulse = [0.0, 0.3, 0.0], grab = true } },
    { at = 160, carry = { transfer = 7, obj = 40, dest = 2 } },
]
2 = [
    { at = 140, touch = { obj = 33, impulse = [2.0, 4.0, 0.0] } },
    { at = 175, touch = { obj = 60, impulse = [0.0, 6.0, 1.0] } },
    { at = 230, touch = { obj = 12, impulse = [0.0, 5.0, 0.0] } },
]

[world.2]
members = [1, 3]
scene = { pile = { side = 5, layers = 3 } }
epoch_ms = 150
hz = 50
seed = 0xB
routes = [1]

[world.2.plan]
3 = [
    { at = 120, touch = { obj = 30, impulse = [0.0, 6.0, 0.0] } },
    { at = 160, touch = { obj = 8, impulse = [3.0, 3.0, 0.0] } },
]

[net]
seed = 21
link = { delay_ms = 50, jitter_ms = 15, loss_pct = 1 }
