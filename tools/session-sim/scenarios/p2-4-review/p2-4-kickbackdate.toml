description = """
P2-4 review round 3, VCR-9: kickwar, with 2 backdating its kick of 1 by 30 frames to come first. \
The backdated kick is void and 2 is removed. The honest members are those left at member 3. \
Part 1 runs with VCR-9's fix switched off, part 2 as shipped."""
include = ["../common/review.toml"]
end_ms = 8000
quiet_panics = true

[world.1]
members = [1, 2, 3, 4]

[world.1.plan]
1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 120, kick = { target = 2 } }]
3 = [{ at = 400, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]

[[byzantine]]
kind = "backdated_kick"
member = 2
at_frame = 120
target = 1
back = 30
to = [1, 3, 4]

[[part]]
world.1.fixes_off = ["VCR9"]
report = [
    { kind = "line", text = "  members left at m3: {member_list@3}" },
    { kind = "before_fix", honest = { members_at = 3 }, label = "kickbackdate (admins 1 and 2 kick each other at frame 120; 2 backdates its kick 30 frames to come first)", fix = "VCR-9's fix" },
]

[[part]]
report = [
    { kind = "view_changes", honest = { members_at = 3 }, label = "kickbackdate" },
    { kind = "admin", honest = { members_at = 3 }, label = "kickbackdate", outcomes = true },
    { kind = "check", case = "kickbackdate", label = "kickbackdate", at = 3, members = [1, 3, 4] },
    { kind = "verdict", honest = { members_at = 3 }, label = "kickbackdate (admins 1 and 2 kick each other at frame 120; 2 backdates its kick 30 frames to come first)" },
]
