description = """
P2-4 review round 5-6, VC4R-1: public join rules. At 1 s joiner 5 asks to join. Round-0 proposer \
1 equivocates its round-0 prevote: the join's value to capper 2, nil to observer 3 and 9; 9's \
round-0 prevotes are lost. 2 sees a polka and precommits with a cap; 3 sees only 2 and 3 prevote \
the value. With the fix off 3 votes 2 out for an unjustified cap; with it, 2's precommit carries \
its polka's prevote ids, 3 fetches 1's, and keeps 2. Part 1 runs with VC4R-1's fix switched off, \
part 2 as shipped. In both runs, as in the spike's log, no view change decides and the world \
pauses at frame 173 (conf 53, the 120-frame window)."""
include = ["../common/review.toml"]
end_ms = 10000
quiet_panics = true
peers = [1, 2, 3, 9, 5]

[world.1]
members = [1, 2, 3, 9]
joiners = [5]
join_rules = { rules = [], fallback = 1 }

[world.1.plan]
# The spike also plans a touch by 1 at frame 600: the world pauses at frame 173 and never reaches
# it, and the tool refuses an action its member never reaches, so it is left out.
1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }]

[[join]]
at_ms = 1000
member = 5
to = [1, 2, 3, 9]

[[byzantine]]
kind = "equivocate_prevote"
member = 1
from_ms = 1000
value_to = [2]
nil_to = [3, 9]

[[fault]]
from = 9
msg = "prevote"
round = 0
drop = true

[[part]]
world.1.fixes_off = ["VC4R1"]
report = [
    { kind = "check", case = "prevotefork_off", at = 3, target = 2, event = "member 2's precommit caps" },
    { kind = "before_fix", honest = [1, 2, 3], label = "prevotefork (proposer 1 equivocates its prevote: v to capper 2, nil to observer 3; 2 caps on the polka, 3 cannot see it)", fix = "VC4R-1's fix" },
]

[[part]]
report = [
    { kind = "view_changes", honest = [1, 2, 3], label = "prevotefork" },
    { kind = "check", case = "prevotefork", label = "prevotefork", at = 3, target = 2, event = "member 2's precommit caps" },
    { kind = "verdict", honest = [1, 2, 3], label = "prevotefork (proposer 1 equivocates its prevote: v to capper 2, nil to observer 3; 2 caps on the polka, 3 cannot see it)" },
]
