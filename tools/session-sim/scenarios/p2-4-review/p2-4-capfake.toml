description = """
P2-4 review round 6, VC6R-1: capstale, but 9's capped precommit names a polka id that exists \
nowhere. Trust survey #4 retired the cap rule and its fetch budget, so the ids a capped precommit \
carries are dead bytes nothing reads (their removal is a follow-up wire change; capfake then folds \
into capstale). The cap holds confirmation until admin 1 kicks 9 at 6 s, which ends it."""
include = ["../common/review.toml"]
end_ms = 14000
quiet_panics = true

[world.1]
members = [1, 2, 3, 9]

# Trust survey #4: admin 1 kicks 9 at 6 s (listed first, as the spike steps it first).
[[byzantine]]
kind = "admin_kick"
member = 1
target = 9
at_ms = 6000
honest = [1, 2, 3]
to = [2, 3, 9]

[[byzantine]]
kind = "precommit"
member = 9
from_ms = 2000
value = 0xBAD0
ahead = 30
to = [1, 2, 3]
every_epoch = true
while_member_at = 1
polka = ["0xDEADBEEF00000001"]

[world.1.plan]
1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 700, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]

[[report]]
kind = "check"
case = "capfake"
label = "capfake"
at = 1
target = 9
honest = [1, 2, 3]

[[report]]
kind = "check"
case = "admin_kick"
label = "capfake"
honest = [1, 2, 3]

[[report]]
kind = "verdict"
honest = [1, 2, 3]
label = "capfake"
