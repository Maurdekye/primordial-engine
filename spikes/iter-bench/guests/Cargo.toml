# Generated by scripts/iter_bench_gen.py. Own workspace: the repo root workspace is untouched.
# Build: cargo build --target wasm32-unknown-unknown [--profile P] -p logic_wasm|logic_mono|mod_movement
[workspace]
resolver = "3"
members = ["pe_api", "sys_movement", "sys_ai", "sys_combat", "sys_inventory", "sys_spawn", "sys_effects", "logic_game", "logic_wasm", "logic_mono", "mod_movement", "logic_native"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.dev]
panic = "abort"

# dev without debug info (smaller .wasm).
[profile.dev-nodbg]
inherits = "dev"
debug = false

# dev with light optimization (opt-level 1), still incremental.
[profile.dev-o1]
inherits = "dev"
opt-level = 1

# Optimized but iteration-friendly: no LTO, parallel codegen, incremental.
[profile.rel-fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
incremental = true
panic = "abort"

# Shipping: fat LTO, one codegen unit.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# No name section (design 13.2, P2-7): it would carry crate hashes that depend on the host OS.
strip = "symbols"

# Like phase-1 guests (opt-level = "s").
[profile.rel-s]
inherits = "release"
opt-level = "s"
