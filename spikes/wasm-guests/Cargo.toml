# Game-logic guest modules. Build with scripts/build_wasm_guests.sh, which remaps local paths
# (design 13.2), or: cargo build --release --target wasm32-unknown-unknown   (from this directory)
# physics_in_wasm lives in the root workspace (spikes/physics-in-wasm): it depends on sim-core and
# the box3d fork by path, and cargo hashes a path dependency's crate identity by its absolute path
# unless it lies inside the building workspace, which made the module's code depend on the checkout
# path (review M8, found at integration).
[workspace]
resolver = "3"
members = ["logic-v1", "logic-v2", "logic-runaway"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
# No name section (design 13.2, P2-7): it would carry crate hashes that depend on the host OS.
strip = "symbols"
