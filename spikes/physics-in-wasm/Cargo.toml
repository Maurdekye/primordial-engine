[package]
name = "physics_in_wasm"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Built for wasm32 from the root workspace: scripts/build_wasm_guests.sh, i.e.
#   cargo build -p physics_in_wasm --target wasm32-unknown-unknown --profile wasm-guest
[lib]
crate-type = ["cdylib"]

[dependencies]
pe-sim-core.workspace = true
