[package]
name = "pe-spike-wasm-hotswap"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase-1 spike (d): hot-swapping Rust->WASM game logic mid-simulation, deterministic across peers and rollback"

[dependencies]
pe-sim-core.workspace = true
box3d-rust.workspace = true
# Pure-Rust interpreter. `deterministic` = Wasm 3.0 deterministic profile (NaN canonicalization).
wasmi = { version = "2", default-features = false, features = ["std", "validate", "deterministic"] }
