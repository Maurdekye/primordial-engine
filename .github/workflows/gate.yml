# The landing gate on hosted runners (user ruling Q12, m08a916809047: "Allow hosted runners"), on every push
# to main, every pull request, and nightly. docs/landing-gates.md describes it.
# - gate: scripts/gate.sh, the native-code audit (the "100% Rust" ruling, D1) and the secret scan, which also
#   run locally on every landing (scripts/hooks/reference-transaction); nightly over the whole history. Its
#   code comes from the base, as on a local landing.
# - tier 2 (docs/refound-plan.md 4.6): scripts/tier2.sh on windows-x64, linux-x64, linux-arm64 and macos-arm64,
#   that is every crate's tests and clippy, with the kept determinism base's tests in release too. pe-physics's
#   tests compare goldens, traces and snapshot images with the committed records, so a pass on a platform means
#   its results are bit-identical with them. A final job then requires the RESULT lines the tests printed to be
#   the same on all four (scripts/tier2_digests.py; coordinator m5fa7906e0a43). Nightly, the agreement model's
#   fast profile, its bounded n = 4 Byzantine checks and its backoff checks run as well. Weekly (the Sunday nightly
#   run), the convergence grid runs on every change, not only on those that trigger tier 1's convergence-grid.
# A red run blocks the next landing until it is fixed or explained (decision C7; scripts/gate.sh reads it through
# scripts/ci_status.py), and WS-ci triages it. The tier-2 jobs write their failures as error annotations, which
# GitHub's public API serves without a login.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  gate:
    name: native audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push) base=$BEFORE ;;
            pull_request) base=$PR_BASE ;;
            *) base= ;;
          esac
          # A new branch, a history rewrite or the nightly run: scan everything HEAD reaches. Otherwise the gate's
          # code comes from the base, as on a local landing: gitleaks is installed, and the gate run, as the
          # base has them (docs/landing-gates.md).
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2> /dev/null; then
            args="--base $base" code=HEAD
            if git cat-file -e "$base:scripts/gate.sh" 2> /dev/null; then code=$base; fi
          else
            args=--full-history code=HEAD
          fi
          git show "$code:scripts/install_gitleaks.sh" > "$RUNNER_TEMP/install_gitleaks.sh"
          git show "$code:scripts/gate.sh" > "$RUNNER_TEMP/gate.sh"
          bash "$RUNNER_TEMP/install_gitleaks.sh"
          bash "$RUNNER_TEMP/gate.sh" $args --report gate-report HEAD
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report
          path: gate-report
          if-no-files-found: ignore
          retention-days: 14

  tier2:
    name: tier 2, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml pins it)
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 2> /dev/null || rustup show
          rustc --version --verbose && cargo --version
      - name: Tests and clippy, then the digests (scripts/tier2.sh)
        env:
          PE_TIER2_PLATFORM: ${{ matrix.name }}
        run: bash scripts/tier2.sh --free-space "tier2-${{ matrix.name }}"
      - name: Keep the digests and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-${{ matrix.name }}
          path: tier2-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  tier2-digests:
    name: tier 2, the same digests on all four
    needs: tier2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tier2-*
          path: tier2
      - name: Compare with windows-x64's, the platform the records were made on
        run: >-
          python3 -I scripts/tier2_digests.py --annotate tier2/tier2-windows-x64 tier2/tier2-linux-x64
          tier2/tier2-linux-arm64 tier2/tier2-macos-arm64

  # Whether tonight is the grid's night: Sunday's nightly run, or the workflow started by hand. On other nights the
  # grid job then shows as skipped, not passed (@design-reviewer's L1 on 95a674f2). A second cron line would also run
  # the gate and the whole of tier 2 again, since they run on every schedule.
  grid-day:
    name: tier 2, the convergence grid's night
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.when.outputs.run }}
    steps:
      - name: Sunday, or started by hand
        id: when
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(date -u +%u)" = 7 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "not Sunday: the weekly grid is skipped tonight"
          fi

  grid:
    name: tier 2, the convergence grid (weekly)
    needs: grid-day
    if: ${{ needs.grid-day.outputs.run == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # The user's convergence target (meef4f248923b, answer 8) on M1's ball pit over pe-agree, 20 seeds x 5 delays
      # (pe-render tests/ballpit.rs; G7). Tier 1 runs it only when pe-render, pe-harness, pe-agree, pe-replica,
      # pe-seams, Cargo.lock or the toolchain change (about 6.5 min a trigger); this run catches a change elsewhere
      # (pe-world, pe-physics, box3d-fork, ...) that moves the balls' paths within a week (coordinator
      # m97d6637b4263). It runs on Sundays' nightly run (grid-day), and whenever the workflow is started by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml pins it)
        run: |
          rustup toolchain install 2> /dev/null || rustup show
          rustc --version --verbose && cargo --version
      - name: The grid over pe-agree
        run: |
          cargo test -p pe-render --release --locked --test ballpit -- --ignored --exact --test-threads 1 the_presenter_meets_the_users_target_over_20_seeds_and_5_delays_over_pe_agree 2>&1 | tee grid.log
          grep -E "^test result: ok\. 1 passed;" grid.log
      - name: Name the failure
        if: ${{ failure() }}
        run: |
          lines=$(grep -E "panicked at|^error|FAILED" grid.log 2> /dev/null | head -20 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=tier 2 grid::the convergence grid failed%0A$lines"

  model:
    name: tier 2, the agreement model (nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml pins it)
        run: |
          rustup toolchain install 2> /dev/null || rustup show
          rustc --version --verbose && cargo --version
      # The fast profile (tier 1's model-fast); the bounded n = 4 Byzantine safety checks, 70-313 s each in
      # models/cuts/README.md's runs and 164-483 s, at most 2.14 GB, in world-chunks' run at 4 threads on the org's
      # machine (mcafd45726788); and the backoff profile of pe-agree's stall fix, about 40 s for its six
      # (m330b0e278085). The set is world-chunks'. A check over 3,599 s counts as failed. The pass line's count also
      # catches a misspelt name, which the model skips.
      - name: The model's checks (models/cuts)
        run: |
          cargo run --release --locked --manifest-path models/cuts/Cargo.toml -- n3-chain n3-sig n3-crash \
            n3-chain-live n3-crash-live n4-byz-live n4-crash-live n3-root bound-n3-byz ctl-d1 ctl-unchecked \
            ctl-quorum ctl-nolock ctl-nosig ctl-noroot ctl-notimeout n4-byz n4-byz-chain n4-root \
            n2-live-backoff bound-n2-backoff ctl-backoff-reset n2-live-early bound-n2-early ctl-early 2>&1 | tee model.log
          grep -E "^all 25 check\(s\) met their expectation" model.log
      - name: Name the failures
        if: ${{ failure() }}
        run: |
          lines=$(grep -E "FAIL|did not meet|panicked at|^error" model.log 2> /dev/null | head -40 | sed 's/%/%25/g' \
            | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=tier 2 model::the model's checks failed%0A$lines"
