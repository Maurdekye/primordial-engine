[package]
name = "pe-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Transport (seam S4): direct QUIC connections from an invite, five lanes, the rate budget, the session clock"

# Skeleton from pe-seams v0 (WS-seams). WS-net, @shader-lang owns this crate and its manifest; the root Cargo.toml
# already lists it, so adding dependencies here needs no other change.
[dependencies]
pe-seams = { path = "../pe-seams" }
pe-net-crypto = { path = "../pe-net-crypto" }
bytes = "1"
quinn-proto = { version = "0.11.19", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std"] }

[features]
# Test and fuzz hooks (`Core::testing_send_record`); never in a build that ships.
testing = []

[dev-dependencies]
# The tests send crafted records through the hooks.
pe-net = { path = ".", features = ["testing"] }
