[package]
name = "pe-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic session harness: network model, scenario runner, properties (DESIGN.md)"

# Skeleton from pe-seams v0 (WS-seams). WS-harness, @harness-eng owns this crate and its manifest; the root Cargo.toml
# already lists it, so adding dependencies here needs no other change.
[dependencies]
pe-seams = { path = "../pe-seams", features = ["test-util"] }
blake3.workspace = true
bytes.workspace = true
