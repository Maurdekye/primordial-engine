[package]
name = "pe-xr"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenXR for Primordial Engine: the session, stereo through pe-render, tracked hands into hand samples, frame pacing (docs/spec/xr.md)"

# Skeleton from pe-seams v0 (WS-seams). WS-xr, @xr-eng owns this crate and its manifest; the root Cargo.toml
# already lists it, so adding dependencies here needs no other change.
[dependencies]
pe-seams = { path = "../pe-seams" }
pe-render = { path = "../pe-render" }
