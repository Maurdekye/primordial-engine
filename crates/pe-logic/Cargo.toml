[package]
name = "pe-logic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Logic: scripts compiled by Cranelift with metering injected into the module, run as systems over the store"

# Skeleton from pe-seams v0 (WS-seams). WS-logic, @iter-bench owns this crate and its manifest; the root Cargo.toml
# already lists it, so adding dependencies here needs no other change.
[dependencies]
pe-core = { path = "../pe-core" }
pe-seams = { path = "../pe-seams" }
# The store the runner works over (logic.md 3.3).
pe-sim = { path = "../pe-sim" }
# The source archive's format and check (logic.md 4.1a): the build service packs and unpacks with pe-world's own
# functions, the ones `CommitScript` applies.
pe-world = { path = "../pe-world" }
# The batch and manifest layout, shared with the guest.
pe-sdk = { path = "../pe-sdk" }
# The patched, vendored copy (vendor/PATCHES.md) through the root [patch.crates-io]: no C on any target.
wasmtime.workspace = true
# The metering pass (logic.md 5.2): parse and validate, then re-encode. Pure Rust; the versions wasmtime 50.0.1
# itself uses, so the lock keeps one copy of each.
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "validate", "features", "simd"] }
wasm-encoder = { version = "=0.261.0", default-features = false, features = ["std", "wasmparser"] }
# rustc's JSON diagnostics (the build service's `BuildError::Rustc`). Pure Rust.
serde_json.workspace = true

[dev-dependencies]
# Tests only: the engine components a script may bind are checked against pe-world's own descriptions (logic.md 3.2).
pe-world = { path = "../pe-world" }
