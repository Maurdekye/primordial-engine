# A test script for pe-logic (docs/spec/logic.md appendix A): the M1 lamp, with its own components. Its own workspace,
# so the root workspace never builds it for the host; pe-logic's tests build it for wasm32 through the build service.
[package]
name = "lamp"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pe-sdk = { path = "../../../../pe-sdk" }
