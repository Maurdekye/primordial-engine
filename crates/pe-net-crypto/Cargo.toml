[package]
name = "pe-net-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "pe-net's security code: a small pure-Rust rustls provider, QUIC packet keys, quinn-proto's crypto traits, peer identity and invites (docs/spec/transport.md 2)."

# Skeleton from pe-seams v0 (WS-seams). WS-net, @shader-lang owns this crate and its manifest; the root Cargo.toml
# already lists it, so adding dependencies here needs no other change.
[dependencies]
pe-seams = { path = "../pe-seams" }
