[package]
name = "pe-net-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "pe-net's security code: a small pure-Rust rustls provider, QUIC packet keys, quinn-proto's crypto traits, peer identity and invites (docs/spec/transport.md 2)."

# Standalone until seams v0's skeleton lands (engine-architect, m8f328685109f); then it joins the root workspace.
[workspace]

[features]
# A seeded randomness source for the deterministic harness (transport.md 8). Never in a shipped build.
insecure-deterministic-rng = ["dep:chacha20"]

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
quinn-proto = { version = "0.11.19", default-features = false }
bytes = "1"
aes = "0.9"
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
chacha20 = { version = "0.10", default-features = false, features = ["cipher"], optional = true }
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"
hkdf = "0.13"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
