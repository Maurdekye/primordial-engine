[package]
name = "pe-session-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process scenario harness for pe-session (P2-3): the spike session-sim's scenarios on the production core"

[lib]
name = "pe_session_sim"
path = "src/lib.rs"

[[bin]]
name = "pe-session-sim"
path = "src/main.rs"

[dependencies]
pe-session = { path = "../pe-session" }
