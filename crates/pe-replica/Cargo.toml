[package]
name = "pe-replica"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The replica (seam S2): one domain's deterministic state machine with its rollback loop, over world-model bodies; the frame view (S5)"

# Skeleton from pe-seams v0 (WS-seams). WS-state, @vdw-physics owns this crate and its manifest; the root Cargo.toml
# already lists it, so adding dependencies here needs no other change.
[dependencies]
bytes.workspace = true
pe-core = { path = "../pe-core" }
pe-seams = { path = "../pe-seams" }
pe-world = { path = "../pe-world" }
pe-physics = { path = "../pe-physics" }
