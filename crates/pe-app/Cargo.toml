[package]
name = "pe-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The headless M1 peer (design 23.4, P2-10): the session protocol over signed UDP, with pe-mcp attached"

[dependencies]
pe-session = { path = "../pe-session" }
pe-mcp = { path = "../pe-mcp" }
ed25519-dalek = "3"
sha2 = "0.11"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "process"] }
