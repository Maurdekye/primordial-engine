[package]
name = "pe-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The application: threads, wiring, invites, configuration, the demo script"

# WS-app, @engine-architect owns this crate and its manifest (docs/spec/app.md 5 lists what it needs from each crate).
[dependencies]
pe-seams = { path = "../pe-seams", features = ["world-api"] }
pe-world = { path = "../pe-world" }
pe-log = { path = "../pe-log" }
pe-agree = { path = "../pe-agree" }
pe-replica = { path = "../pe-replica" }
pe-net = { path = "../pe-net" }
pe-logic = { path = "../pe-logic" }
pe-api = { path = "../pe-api" }
pe-mcp = { path = "../pe-mcp" }
pe-render = { path = "../pe-render" }
pe-xr = { path = "../pe-xr" }
pe-diverge = { path = "../pe-diverge" }

# The host clock reads CLOCK_MONOTONIC there (src/clock.rs); on Windows it reads QPC, which needs no crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
