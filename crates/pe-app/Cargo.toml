[package]
name = "pe-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The application: threads, wiring, invites, configuration, the demo script"

# WS-app, @engine-architect owns this crate and its manifest (docs/spec/app.md 5 lists what it needs from each crate).
[dependencies]
pe-seams = { path = "../pe-seams", features = ["world-api"] }
pe-world = { path = "../pe-world" }
pe-log = { path = "../pe-log" }
pe-agree = { path = "../pe-agree" }
# The `logic` feature: pe-logic's runner, which pe-app hands each replica it builds (pe-replica crate::logic).
pe-replica = { path = "../pe-replica", features = ["logic"] }
pe-net = { path = "../pe-net" }
pe-net-crypto = { path = "../pe-net-crypto" }
pe-logic = { path = "../pe-logic" }
pe-api = { path = "../pe-api" }
pe-mcp = { path = "../pe-mcp" }
pe-render = { path = "../pe-render" }
pe-xr = { path = "../pe-xr" }
pe-diverge = { path = "../pe-diverge" }
# The physics self-test pe-diverge asks for (src/diverge.rs; divergence.md 5, step 2).
pe-physics = { path = "../pe-physics" }
# The genesis record's session nonce: the OS's randomness, the getrandom pe-net-crypto uses (src/genesis.rs).
getrandom = "0.4"
# The MCP thread's runtime (app.md 1): pe-mcp's transports run on tokio, the version pe-mcp uses.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
# The Replica trait's `module` returns Bytes, which the phase timer's wrapper passes through (src/phases.rs).
bytes.workspace = true

# The two-member test: pe-seams's test keys, and Bytes for its in-process Transport.
[dev-dependencies]
pe-seams = { path = "../pe-seams", features = ["world-api", "test-util"] }
# The damage hook the split test injects a divergence through (sim.rs); never in the shipped binary (resolver 3).
pe-replica = { path = "../pe-replica", features = ["logic", "test-util"] }
bytes.workspace = true
# The agent demo script (src/agent_demo.rs) and the M1 demo test (tests/demo.rs): an MCP client over pe-mcp's
# server, as pe-mcp's own tests use it. The test also needs tokio's timers and its process pipes.
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net"] }
serde_json.workspace = true

# The host clock reads CLOCK_MONOTONIC there (src/clock.rs); on Windows it reads QPC, which needs no crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
