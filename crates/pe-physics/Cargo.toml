[package]
name = "pe-physics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Primordial Engine physics: the engine's only door to the box3d fork (bodies bound to sim objects, interactions, world images, parallel stepping)"

[dependencies]
box3d-rust.workspace = true
pe-core = { path = "../pe-core" }
pe-sim = { path = "../pe-sim" }

[features]
# Fill the fork's stage profile (Box3D `Profile`) with wall-clock timings.
stage-profile = ["box3d-rust/stage-profile"]
