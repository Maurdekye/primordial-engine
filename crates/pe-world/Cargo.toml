[package]
name = "pe-world"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The world model: the object tree, components and blobs, the hash tree, edit entries and their conflict rules, governance validity"

# Skeleton from pe-seams v0 (WS-seams). WS-world, @world-model owns this crate and its manifest; the root Cargo.toml
# already lists it, so adding dependencies here needs no other change.
[dependencies]
pe-core = { path = "../pe-core" }
pe-sim = { path = "../pe-sim" }
pe-seams = { path = "../pe-seams" }

[features]
# Planted defects for the harness's mutation tests (pe-harness DESIGN.md 6.1): inert unless a node's configuration
# names one, and never in a production build (the gate checks pe-app's normal edges).
mutants = []
