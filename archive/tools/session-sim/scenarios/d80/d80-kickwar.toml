description = """
D80 (design 10.8, 12.1): admins 1 and 2 kick each other at frame 120; commit order removes one. \
Every member is an admin (role 0) by default; the honest members are those left at member 3."""
include = ["../common/review.toml"]
end_ms = 8000

[world.1]
members = [1, 2, 3, 4]

[world.1.plan]
1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 120, kick = { target = 2 } }]
2 = [{ at = 120, kick = { target = 1 } }]
3 = [{ at = 400, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]

[[report]]
kind = "view_changes"
honest = { members_at = 3 }
label = "kickwar"

[[report]]
kind = "admin"
honest = { members_at = 3 }
label = "kickwar"
outcomes = true
roles = true

[[report]]
kind = "check"
case = "kickwar"
label = "kickwar"
at = 3
members = [1, 2]

[[report]]
kind = "verdict"
honest = { members_at = 3 }
label = "kickwar (admins 1 and 2 kick each other at frame 120)"
