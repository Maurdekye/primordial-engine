description = """
P2-4 review round 6, VC5R-2: from 2 s, 8 alternates every 50 ms between acks naming a fake id at \
its current seq of 1's chain and acks naming a stale real head (freeze_others), re-frozen at most \
every 0, 1 or 2 s, so its verified reference keeps rising. Control (part 1): the fake for good, \
which holds confirmation until admin 1 kicks 8 at 6 s (trust survey #4). A report of the spike's, \
not a fix-off repro."""
include = ["../common/review.toml"]
end_ms = 14000
quiet_panics = true

[world.1]
members = [1, 2, 3, 4, 8]

[world.1.plan]
# The spike's 40 touches by 1 at frame 60 + 20k on objects 10 + k mod 3; the last (k = 39, frame 840)
# is past the end of the run (frame 833): it never fires, and the tool refuses an action its member
# never reaches, so it is left out.
1 = [
    { at = 60, every = 60, count = 13, touch = { obj = 10, impulse = [0.0, 1.0, 0.0] } },
    { at = 80, every = 60, count = 13, touch = { obj = 11, impulse = [0.0, 1.0, 0.0] } },
    { at = 100, every = 60, count = 13, touch = { obj = 12, impulse = [0.0, 1.0, 0.0] } },
]

[[part]]
# Trust survey #4: the pure fake holds confirmation until admin 1 kicks 8 at 6 s.
byzantine = [{ kind = "admin_kick", member = 1, target = 8, at_ms = 6000, honest = [1, 2, 3, 4], to = [2, 3, 4, 8] }, { kind = "fake_refs", member = 8, from_ms = 2000, of = 1, n = 0 }]
report = [
    { kind = "check", case = "fakemix", label = "fakemix mix=false stale-refresh=0us", at = 1, target = 8, event = "has referenced no more", honest = [1, 2, 3, 4] },
    { kind = "check", case = "admin_kick", label = "fakemix", honest = [1, 2, 3, 4] },
    { kind = "verdict", honest = [1, 2, 3, 4], label = "fakemix mix=false" },
]

[[part]]
byzantine = [{ kind = "mix_refs", member = 8, of = 1, from_ms = 2000, every_ms = 50, refresh_ms = 0 }]
report = [
    { kind = "check", case = "fakemix", label = "fakemix mix=true stale-refresh=0us", at = 1, target = 8, event = "has referenced no more", honest = [1, 2, 3, 4] },
    { kind = "verdict", honest = [1, 2, 3, 4], label = "fakemix mix=true" },
]

[[part]]
byzantine = [{ kind = "mix_refs", member = 8, of = 1, from_ms = 2000, every_ms = 50, refresh_ms = 1000 }]
report = [
    { kind = "check", case = "fakemix", label = "fakemix mix=true stale-refresh=1000000us", at = 1, target = 8, event = "has referenced no more", honest = [1, 2, 3, 4] },
    { kind = "verdict", honest = [1, 2, 3, 4], label = "fakemix mix=true" },
]

[[part]]
byzantine = [{ kind = "mix_refs", member = 8, of = 1, from_ms = 2000, every_ms = 50, refresh_ms = 2000 }]
report = [
    { kind = "check", case = "fakemix", label = "fakemix mix=true stale-refresh=2000000us", at = 1, target = 8, event = "has referenced no more", honest = [1, 2, 3, 4] },
    { kind = "verdict", honest = [1, 2, 3, 4], label = "fakemix mix=true" },
]
