description = """
P2-4 review round 8, VC7R-1 over a fork segment of two entries (design-reviewer's probe \
`voiddeep`): every member an admin, {1, 2, 3, 4}. At 2 s the round-0 proposer 1 sends 2 and 3 \
two Attests (its real chain, seqs s and s+1) and sends 4 a forged branch at the same seqs: an ack \
declaring horizon H, then a SetRole demoting 4 stamped behind H; at 2.1 s each gets the other \
branch. 1 proposes a change listing the SetRole, prevotes it, drops its precommits and crashes \
once 2 and 3 have precommitted (or at 6 s). Part 1 (void, VC7R-1's fix off): 2 and 3 lock on it \
and the session halts. Part 2 (void, as shipped): the listing is replayed along its own ancestry, \
refused everywhere, and 1 is removed. Part 3 (valid): the ack claims epoch + 2, so it breaks VC-5 \
and counts for nothing, the SetRole is valid on its own ancestry, and every member decides it."""
include = ["../common/review.toml"]
end_ms = 14000
quiet_panics = true

[world.1]
members = [1, 2, 3, 4]
guests = { role = 1, admins = [1, 2, 3, 4] }

[[fault]]
from = 1
msg = "precommit"
drop = true

[[part]]
world.1.fixes_off = ["VC7R1"]
# This part halts (frame 230 at the end), so the spike's touch by 1 at frame 700 never fires; the tool
# refuses an action its member never reaches, so this part's plan leaves it out.
world.1.plan.1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }]
byzantine = [{ kind = "fork_segment", member = 1, at_ms = 2000, swap_ms = 2100, p = 4, others = [2, 3], segment = "void_role", role = 1, crash_by_ms = 6000, own_fixes_off = ["VC3R3"] }]
report = [
    { kind = "check", case = "voiddeep", label = "voiddeep void fixes_off=0x200000000", role = 1, honest = [2, 3, 4] },
    { kind = "view_changes", honest = [2, 3, 4], label = "voiddeep" },
    { kind = "verdict", honest = [2, 3, 4], label = "voiddeep void fixes_off=0x200000000" },
]

[[part]]
world.1.plan.1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 700, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]
byzantine = [{ kind = "fork_segment", member = 1, at_ms = 2000, swap_ms = 2100, p = 4, others = [2, 3], segment = "void_role", role = 1, crash_by_ms = 6000, own_fixes_off = ["VC3R3"] }]
report = [
    { kind = "check", case = "voiddeep", label = "voiddeep void fixes_off=0x0", role = 1, honest = [2, 3, 4] },
    { kind = "view_changes", honest = [2, 3, 4], label = "voiddeep" },
    { kind = "verdict", honest = [2, 3, 4], label = "voiddeep void fixes_off=0x0" },
]

[[part]]
world.1.plan.1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 700, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]
byzantine = [{ kind = "fork_segment", member = 1, at_ms = 2000, swap_ms = 2100, p = 4, others = [2, 3], segment = "valid_role", role = 1, crash_by_ms = 6000, own_fixes_off = ["VC3R3"] }]
report = [
    { kind = "check", case = "voiddeep", label = "voiddeep valid fixes_off=0x0", role = 1, honest = [2, 3, 4] },
    { kind = "view_changes", honest = [2, 3, 4], label = "voiddeep" },
    { kind = "verdict", honest = [2, 3, 4], label = "voiddeep valid fixes_off=0x0" },
]
