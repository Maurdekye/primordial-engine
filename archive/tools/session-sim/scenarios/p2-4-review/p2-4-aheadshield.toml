description = """
P2-4 review round 4, VC3R-1 (the reviewer's repro): from 2 s 9's acks climb to epoch 1 with no \
decision behind it, while from 1.9 s it sends each of its entries to one honest member only, in \
turn. Each half alone and both: rotating alone is harmless (fetches fill every gap). Since trust \
survey #4 VC-5's vote (and VC3R-1's fix to its timer) is retired, so a climbing 9 holds \
confirmation (no reader counts its acks from the claimed epoch on) until admin 1 kicks it at 6 s, \
which ends it."""
include = ["../common/review.toml"]
end_ms = 12000
quiet_panics = true

[world.1]
members = [1, 2, 3, 9]

[world.1.plan]
1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 600, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]

[[part]]
byzantine = [{ kind = "admin_kick", member = 1, target = 9, at_ms = 6000, honest = [1, 2, 3], to = [2, 3, 9] }, { kind = "fake_ack_epoch", member = 9, from_ms = 2000, epoch = 1 }]
report = [
    { kind = "confs", honest = [1, 2, 3], label = "aheadshield climb=true rotate=false" },
    { kind = "check", case = "admin_kick", label = "aheadshield climb=true rotate=false", honest = [1, 2, 3] },
    { kind = "verdict", honest = [1, 2, 3], label = "aheadshield (from 2 s, 9's acks claim epoch 1: true; 9 sends each of its entries to one honest member only, in turn: false)" },
]

[[part]]
byzantine = [{ kind = "rotate_entries", member = 9, from_ms = 1900, to = [1, 2, 3] }]
report = [
    { kind = "check", case = "aheadshield", text = "climb=false rotate=true", at = 1, target = 9, honest = [1, 2, 3], expect = "harmless", conf_min = 600 },
    { kind = "verdict", honest = [1, 2, 3], label = "aheadshield (from 2 s, 9's acks claim epoch 1: false; 9 sends each of its entries to one honest member only, in turn: true)" },
]

[[part]]
byzantine = [{ kind = "admin_kick", member = 1, target = 9, at_ms = 6000, honest = [1, 2, 3], to = [2, 3, 9] }, { kind = "fake_ack_epoch", member = 9, from_ms = 2000, epoch = 1 }, { kind = "rotate_entries", member = 9, from_ms = 1900, to = [1, 2, 3] }]
report = [
    { kind = "confs", honest = [1, 2, 3], label = "aheadshield climb=true rotate=true" },
    { kind = "check", case = "admin_kick", label = "aheadshield climb=true rotate=true", honest = [1, 2, 3] },
    { kind = "verdict", honest = [1, 2, 3], label = "aheadshield (from 2 s, 9's acks claim epoch 1: true; 9 sends each of its entries to one honest member only, in turn: true)" },
]
