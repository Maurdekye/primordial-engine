description = """
P2-4 review round 7, VC7R-1 (fixed in round 8): every member an admin, {1, 2, 3, 4}. At 2 s the \
round-0 proposer 1 forks one seq: its real entry, an Attest, to 2 and 3, and a SetRole demoting \
4, stamped 60 frames behind it (so void), to 4; at 2.1 s each gets the other version. 1 proposes \
a change listing the SetRole, prevotes it (its own code skips the admin checks: VC3R3 off at 1), \
drops its precommits, and crashes once 2 and 3 have precommitted. 4 linked the void version, the \
others hold it as a duplicate. With VC7R-1's fix off they lock on the change while 4 prevotes nil \
for good, and the session halts. As shipped the void listing is refused everywhere and 1 is \
removed. Part 1 runs with VC7R-1's fix switched off, part 2 as shipped."""
include = ["../common/review.toml"]
end_ms = 14000
quiet_panics = true

[world.1]
members = [1, 2, 3, 4]
guests = { role = 1, admins = [1, 2, 3, 4] }

[[byzantine]]
kind = "fork_segment"
member = 1
at_ms = 2000
swap_ms = 2100
p = 4
others = [2, 3]
segment = "void_one"
role = 1
back = 60
own_fixes_off = ["VC3R3"]

[[fault]]
from = 1
msg = "precommit"
drop = true

[[part]]
world.1.fixes_off = ["VC7R1"]
# This part halts (frame 230 at the end), so the spike's touch by 1 at frame 700 never fires; the tool
# refuses an action its member never reaches, so this part's plan leaves it out.
world.1.plan.1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }]
report = [
    { kind = "check", case = "voidfork", label = "voidfork fixed=false", honest = [2, 3, 4] },
    { kind = "view_changes", honest = [2, 3, 4], label = "voidfork" },
    { kind = "verdict", honest = [2, 3, 4], label = "voidfork fixed=false" },
]

[[part]]
world.1.plan.1 = [{ at = 60, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }, { at = 700, touch = { obj = 33, impulse = [0.0, 3.0, 0.0] } }]
report = [
    { kind = "check", case = "voidfork", label = "voidfork fixed=true", honest = [2, 3, 4] },
    { kind = "view_changes", honest = [2, 3, 4], label = "voidfork" },
    { kind = "verdict", honest = [2, 3, 4], label = "voidfork fixed=true" },
]
