honest = [1, 2, 3, 4]
label = "twosilent"

[[report]]
kind = "view_changes"
honest = [1, 2, 3, 4]
label = "twosilent"

[[report]]
kind = "verdict"
honest = [1, 2, 3, 4]
label = "twosilent (members 5 and 6 of 6 silent from t=3 s)"
