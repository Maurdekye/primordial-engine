description = """
P2-4: 9 signs a second version of a confirmed touch; colluder 8 acks normally but never casts a \
view-change entry. 1, 2 and 3 remove 9 without 8 (3 of the 4 not proven)."""
include = ["../common/review.toml"]
end_ms = 8000

[world.1]
members = [1, 2, 3, 8, 9]

[world.1.plan]
9 = [{ at = 50, touch = { obj = 10, impulse = [0.0, 6.0, 0.0] } }]

[world.1.member.8]
withhold_vc = true

[[byzantine]]
kind = "equivocate"
member = 9
entry = "first_touch"
when = { conf_above = { at = 1, frame = 200 } }
touch = { obj = 10, impulse = [6.0, 0.0, 0.0] }
to = [1, 2, 3, 8]
say = "  t={t_ms} ms: 9's touch s{x.seq} at frame {x.stamp} confirmed at m1: {x.confirmed@1}, at m2: {x.confirmed@2} (m1 conf {conf@1}) -> 9 signs a second version"

[[report]]
kind = "touches"
author = 9
at = [1, 2, 3]
text = "9's touches at m{m}"

[[report]]
kind = "membership"
honest = [1, 2, 3]
label = "withheld"

[[report]]
kind = "view_changes"
honest = [1, 2, 3]
label = "withheld"

[[report]]
kind = "verdict"
honest = [1, 2, 3]
label = "withheld (9 equivocates on a confirmed touch; 8 casts no view-change entry)"
