description = """
Fault kinds (P2-9): a partition {1, 2} | {3} from 2 s to 3.5 s, shorter than the silence \
threshold (suspect_after 180 frames = 3 s), then healed. Gap repair must bring member 3 back \
without an eviction, and every replica must end equal to the offline replay."""
include = ["../common/pile.toml", "../common/scripted.toml"]
end_ms = 10000

[net]
seed = 31
link = { delay_ms = 30, jitter_ms = 10, loss_pct = 1 }

[[fault]]
partition = [[1, 2], [3]]
after_ms = 2000
before_ms = 3500
drop = true

[[report]]
kind = "membership"
honest = [1, 2, 3]
label = "fault-partition-heal"

[[report]]
kind = "stats"

[[report]]
kind = "check_world"
frames = 550
label = "fault-partition-heal"
