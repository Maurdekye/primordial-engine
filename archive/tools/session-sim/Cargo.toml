[package]
name = "pe-session-sim"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Session simulator as a test tool (design 23.4, P2-9): scenario files, fault injection, regression command"

[[bin]]
name = "pe-session-sim"
path = "src/main.rs"

[dependencies]
# P2-3: the protocol core is pe-session and the in-process simulator (Net, Sim, Peer) its harness.
# The harness's library keeps its spike name (pe_session_sim, the tool's own); the tool calls it
# pe_session_harness.
pe-session = { path = "../../crates/pe-session" }
pe_session_harness = { package = "pe-session-harness", path = "../../crates/pe-session-harness" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
