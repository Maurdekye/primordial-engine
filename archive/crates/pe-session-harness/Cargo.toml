[package]
name = "pe-session-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process scenario harness for pe-session (P2-3): the spike session-sim (Net, Sim, Peer and its scenarios) forked onto the production core"

[lib]
name = "pe_session_sim"
path = "src/lib.rs"

[[bin]]
name = "pe-session-harness"
path = "src/main.rs"

[dependencies]
pe-session = { path = "../pe-session" }
# The check-hash cost breakdown (PE_CHECK_TIMING).
pe-physics = { path = "../pe-physics" }
