[workspace]
resolver = "3"
members = [
    "spikes/sim-core",
    "spikes/physics",
    "spikes/p2p",
    "spikes/wasm-hotswap",
    "spikes/mcp-stub",
]
# Guest game-logic crates build for wasm32-unknown-unknown separately.
exclude = ["spikes/wasm-guests", "spikes/stack-audit"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
box3d-rust = "=0.5.0"
pe-sim-core = { path = "spikes/sim-core" }

[profile.release]
debug = false
