[workspace]
resolver = "3"
members = [
    "crates/box3d-fork",
    "crates/pe-core",
    "crates/pe-sim",
    "crates/pe-physics",
]
# The re-founding (docs/refound-plan.md): the old engine is archived. archive/ holds the crates the new ones
# port from, for reading only, until M3; everything else is at the tag archive/v0-prototype. The spikes left
# in spikes/ are references with their own builds (the guest crates build for wasm32-unknown-unknown).
exclude = ["archive", "spikes/wasm-guests", "spikes/stack-audit", "spikes/iter-bench", "spikes/chunks"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
box3d-rust = "=0.5.0"

# Our fork of box3d-rust 0.5.0 (MIT): the scale-dependent contact-recycling radius
# ("van der Waals simulation"). Toggle-off is bit-identical to the published crate.
[patch.crates-io]
box3d-rust = { path = "crates/box3d-fork" }

[profile.release]
debug = false

# The wasm guest profile, kept for guest builds (the logic guests' own workspace uses the same settings):
# cargo build -p <guest> --target wasm32-unknown-unknown --profile wasm-guest
[profile.wasm-guest]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
# No name section (design 13.2, P2-7): cargo's crate identity for a nested workspace member
# (crates/box3d-fork) depends on the host OS's path spelling, and the mangled
# names carry it, so Windows and Linux builds differed there and nowhere else.
strip = "symbols"
